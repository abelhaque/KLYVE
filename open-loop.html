<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLYVE — The Open Loop</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:520px;width:100%;padding:88px 24px 32px;text-align:center;}
  .toggle{display:flex;justify-content:center;gap:8px;margin-bottom:28px;}
  .toggle button{padding:9px 20px;border-radius:999px;font-size:14px;cursor:pointer;background:transparent;border:1px solid #334155;color:#94A3B8;font:inherit;transition:all .2s;}
  .toggle button.active{border-color:#F8FAFC;color:#F8FAFC;}
  svg{display:block;width:100%;}
  #tagline{font-size:18px;font-weight:600;margin-top:24px;color:#F8FAFC;}
  .cta{display:inline-block;margin-top:28px;background:#10B981;color:#06251B;font-weight:700;padding:14px 32px;border-radius:10px;text-decoration:none;font-size:16px;}
</style>
</head>
<body>
<div style="position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;z-index:10;background:rgba(15,23,42,.9);"><a href="index.html" style="color:#F8FAFC;text-decoration:none;font-weight:700;font-size:17px;">KLYVE<span style="color:#10B981;">.</span></a><div style="display:flex;gap:16px;font-size:13px;"><a href="index.html" style="color:#94A3B8;text-decoration:none;">Merchants</a><a href="spend-crypto.html" style="color:#94A3B8;text-decoration:none;">Spend crypto</a><a href="franchise.html" style="color:#94A3B8;text-decoration:none;">Franchise</a></div></div>
<div class="wrap" style="margin-top:56px;">
  <div class="toggle">
    <button id="btnClosed">Their loop</button>
    <button id="btnOpen" class="active">KLYVE · open loop</button>
  </div>

  <svg viewBox="0 0 480 250">
    <g id="sceneClosed">
      <circle cx="185" cy="110" r="75" fill="none" stroke="#475569" stroke-width="6"/>
      <circle cx="295" cy="110" r="75" fill="none" stroke="#475569" stroke-width="6"/>
      <circle r="5.5" fill="#475569">
        <animateMotion dur="4s" repeatCount="indefinite" path="M 145 110 a 40 40 0 1 0 80 0 a 40 40 0 1 0 -80 0"/>
      </circle>
      <circle r="5.5" fill="#475569">
        <animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M 255 110 a 40 40 0 1 0 80 0 a 40 40 0 1 0 -80 0"/>
      </circle>
      <text x="185" y="216" text-anchor="middle" font-size="13" fill="#94A3B8">value stuck inside each app</text>
    </g>

    <g id="sceneOpen">
      <circle cx="185" cy="110" r="75" fill="none" stroke="#10B981" stroke-width="6" pathLength="100" stroke-dasharray="76 24" transform="rotate(-43.2 185 110)"/>
      <circle cx="295" cy="110" r="75" fill="none" stroke="#10B981" stroke-width="6" pathLength="100" stroke-dasharray="76 24" transform="rotate(136.8 295 110)"/>
      <circle r="5.5" fill="#10B981">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M -10 110 L 490 110"/>
      </circle>
      <circle r="5.5" fill="#10B981">
        <animateMotion dur="2.6s" begin="-0.9s" repeatCount="indefinite" path="M -10 110 L 490 110"/>
      </circle>
      <circle r="5.5" fill="#10B981">
        <animateMotion dur="2.6s" begin="-1.7s" repeatCount="indefinite" path="M -10 110 L 490 110"/>
      </circle>
      <text x="130" y="216" text-anchor="middle" font-size="13" fill="#94A3B8">money in — any wallet, anywhere</text>
      <text x="350" y="216" text-anchor="middle" font-size="13" fill="#94A3B8">money out — any terminal, anywhere</text>
      <text x="240" y="240" text-anchor="middle" font-size="12" fill="#64748B">received = spendable in ~2 seconds</text>
    </g>
  </svg>

  <div id="tagline">Everyone else closes the loop. KLYVE leaves it open.</div>
  <a class="cta" href="#">Get KLYVE — the open-loop card</a>
</div>

<script>
(function(){
  var bC=document.getElementById('btnClosed'), bO=document.getElementById('btnOpen');
  var sC=document.getElementById('sceneClosed'), sO=document.getElementById('sceneOpen');
  sC.style.display='none';
  function set(open){
    sC.style.display=open?'none':'';
    sO.style.display=open?'':'none';
    bO.classList.toggle('active',open);
    bC.classList.toggle('active',!open);
    document.getElementById('tagline').textContent = open
      ? 'Everyone else closes the loop. KLYVE leaves it open.'
      : 'Closed loops trap your value inside one app.';
  }
  bC.addEventListener('click',function(){set(false);});
  bO.addEventListener('click',function(){set(true);});
})();
</script>

<div style="max-width:900px;margin:0 auto;padding:28px 24px;text-align:center;border-top:1px solid #334155;">
  <div style="display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:center;font-size:13px;">
    <a href="index.html" style="color:#94A3B8;text-decoration:none;">Merchants</a>
    <a href="spend-crypto.html" style="color:#94A3B8;text-decoration:none;">Spend crypto anywhere</a>
    <a href="remittance.html" style="color:#94A3B8;text-decoration:none;">Send money home</a>
    <a href="fee-savings.html" style="color:#94A3B8;text-decoration:none;">Merchant fee savings</a>
    <a href="merchant-calculator.html" style="color:#94A3B8;text-decoration:none;">Merchant pay calculator</a>
    <a href="payme-generator.html" style="color:#94A3B8;text-decoration:none;">PayMe generator</a>
    <a href="open-loop.html" style="color:#94A3B8;text-decoration:none;">The open loop</a>
    <a href="franchise.html" style="color:#94A3B8;text-decoration:none;">Franchise opportunity</a>
  </div>
</div>
</body>
</html>
